name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  planner:
    name: 規劃器驗證
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 沒有任何相依套件，所以不需要 npm install
      - name: 重跑積分與碰撞檢查
        run: node test/verify.mjs
